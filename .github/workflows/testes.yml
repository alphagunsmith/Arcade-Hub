# Roda os testes a cada push e em pull requests, no Windows (onde o app roda de
# verdade: inclui o PowerShell que conta o tempo de jogo) e no Linux.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
