# Gera o instalador do Windows e publica no GitHub Releases.
# Para lançar uma versão: mude "version" no package.json e faça push no main.
# O electron-builder cria a release (tag v<versão>) e envia o instalador, o
# portátil, o .zip e o latest.yml que o atualizador do app usa.
# Se a versão não mudou, ele vê que a release já existe e não publica de novo.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas do DualSense Auto
        run: python -m pip install numpy psutil mss pyinstaller
      - run: npm ci
      - name: Testes (se algum falhar, nada é publicado)
        run: npm test
      - name: Gerar o DualSenseAuto.exe (vai junto no instalador)
        timeout-minutes: 20
        run: python dualsense/empacotar.py
      - name: Conferir o DualSenseAuto.exe
        timeout-minutes: 8
        run: node test/exe-dualsense.js build/dualsense/DualSenseAuto/DualSenseAuto.exe
      - name: Gerar instalador e publicar
        run: npx electron-builder --win nsis portable zip --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
